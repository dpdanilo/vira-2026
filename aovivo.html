<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apuração ao vivo · 2º turno 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--txt:#2a3441;--sub:#5b6573;--linha:#e2dccf;--linha2:#efe9dc;--acento:#3b6f8f;--acento-tx:#fffdf8;--chip:#e8e2d4;--neutro-bg:#ece8df;--realce:#3d4752;--cor-a:#3b6f8f;--cor-b:#d9822b;--ruim:#b0412e;color-scheme:light}
:root[data-theme="dark"]{--bg:#1c2229;--card:#252c35;--txt:#ebe6dc;--sub:#a9b2bd;--linha:#38424e;--linha2:#2f3843;--acento:#86b5d3;--acento-tx:#14202a;--chip:#323b46;--neutro-bg:#323b46;--realce:#e3e7ec;--cor-a:#6f9ec0;--cor-b:#e3a35f;--ruim:#f0937f;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--linha)}
.cab-id{min-width:0;flex:1 1 300px}
.cab-id h1{margin:0;font-size:1.1rem;font-weight:800}
.cab-id p{margin:2px 0 0;font-size:.8rem;color:var(--sub)}
.cab-acoes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.estado{font-size:.82rem;color:var(--sub);display:flex;align-items:center;gap:6px}
.bolinha{width:10px;height:10px;border-radius:5px;background:var(--sub);display:inline-block}
.bolinha.viva{background:#2f7d4f;animation:pisca 2s infinite}
@keyframes pisca{50%{opacity:.35}}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--linha);background:var(--card)}
.btn-icone{width:44px;height:44px;border:1px solid var(--linha);border-radius:22px;background:var(--card)}
.fonte{margin:12px 24px 0;padding:10px 14px;border-radius:12px;background:var(--neutro-bg);font-size:.85rem}
.aviso{margin:8px 24px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--ruim);color:var(--txt);background:var(--card);font-size:.85rem}
.migalhas{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin:12px 24px 0;font-size:.9rem}
.migalhas button{border:0;background:none;color:var(--acento);font-weight:600;min-height:44px;padding:0 4px;text-decoration:underline}
.migalhas .aqui{font-weight:800;padding:0 4px}
.migalhas .sep{color:var(--sub)}
.migalhas .niv{font-size:.7rem;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
.tela{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:16px;padding:12px 24px 32px;max-width:1400px;margin:0 auto}
.cartao{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:16px;min-width:0}
.painel-lista{grid-column:1/-1}
h2{margin:0;font-size:1.25rem;font-weight:800}
h3{margin:14px 0 6px;font-size:.95rem}
.rot{font-size:.8rem;color:var(--sub);margin:2px 0 0}
.barra{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:6px 0 2px}
.barra i{display:block;height:100%;background:var(--acento)}
.fins{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.fin{border-radius:12px;padding:10px 12px;background:var(--bg);border-top:4px solid var(--c)}
.fin .nm{font-weight:700;font-size:.92rem}
.fin .pc{font-size:1.7rem;font-weight:800;line-height:1.1;margin:4px 0 0;font-variant-numeric:tabular-nums}
.fin .vt{font-size:.78rem;color:var(--sub)}
.regua{margin-top:4px}
.regua svg{width:100%;height:auto;display:block}
.regua text{fill:var(--sub);font-size:11px;font-family:inherit}
.justa{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--neutro-bg);font-size:.85rem}
.justa p{margin:0 0 6px}
.tab{width:100%;border-collapse:collapse;font-size:.86rem}
.tab th{font-size:.74rem;color:var(--sub);font-weight:600;text-align:left;border-bottom:1px solid var(--linha);padding:6px 5px}
.tab td{border-bottom:1px solid var(--linha2);padding:6px 5px;vertical-align:middle}
.tab .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab th button{border:0;background:none;color:var(--sub);font-weight:600;font-size:.74rem;padding:6px 0;min-height:32px;text-align:inherit}
.tab th button[aria-sort]{color:var(--txt);font-weight:800}
.tab td button{border:0;background:none;color:var(--acento);font-weight:600;padding:6px 0;min-height:36px;text-align:left;text-decoration:underline}
.tab tr.sel td{background:var(--linha2)}
.tab-rola{max-height:560px;overflow:auto}
.tab-x{overflow-x:auto;max-width:100%}
.tab small{display:block;color:var(--sub);font-size:.72rem}
.tab .eleicao{white-space:nowrap}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--chip);border-radius:12px;padding:4px}
.seg button{min-height:40px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--txt);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.ctl .rot{margin:0}
.busca{min-height:44px;border-radius:10px;border:1px solid var(--linha);background:var(--card);padding:0 10px;font-size:16px;min-width:0;flex:1 1 180px;max-width:320px}
.mapa{height:520px;border-radius:12px;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:inherit}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--sub);margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:14px;height:14px;border-radius:3px;display:inline-block}
.nota{font-size:.78rem;color:var(--sub);margin:6px 0 0}
.sem-mapa{padding:24px;text-align:center;color:var(--sub);border:1px dashed var(--linha);border-radius:12px}
.abas-cel{display:none}
.nav{display:flex;flex-direction:column;gap:4px;margin:10px 0 4px}
.nav-sel{min-height:44px;border-radius:10px;border:1px solid var(--linha);background:var(--card);color:var(--txt);padding:0 10px;font-size:16px;max-width:100%}
.ponto{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px}
@media (max-width:760px){
  .cab{padding:8px 12px}
  .cab-id h1{font-size:1rem}
  .fonte,.aviso,.migalhas{margin-left:12px;margin-right:12px}
  .tela{display:block;padding:8px 12px 84px}
  .tela>section{display:none}
  body[data-aba="resumo"] .tela>[data-sec="resumo"],body[data-aba="mapa"] .tela>[data-sec="mapa"],body[data-aba="lista"] .tela>[data-sec="lista"]{display:block}
  .mapa{height:calc(100vh - 330px);min-height:280px}
  .abas-cel{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);border-top:1px solid var(--linha);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .abas-cel button{flex:1;min-height:52px;border:0;background:none;color:var(--sub);font-size:.85rem;border-radius:10px}
  .abas-cel button[aria-current="page"]{color:var(--acento);font-weight:800;background:var(--bg)}
  .tab-rola{max-height:none}
  html,body{overflow-x:hidden}
  .fin .pc{font-size:1.4rem}
}
</style>
</head>
<body data-aba="resumo">
<header class="cab">
  <div class="cab-id"><h1>Apuração ao vivo · Presidente · 2º turno de 2026</h1><p id="cab-sub">Carregando…</p></div>
  <div class="cab-acoes"><span id="estado" class="estado"></span><button class="btn" data-acao="atualizar">Atualizar agora</button><button class="btn-icone" data-acao="tema" aria-label="Trocar tema claro/escuro">◐</button></div>
</header>
<div id="fonte" class="fonte">Carregando a base…</div>
<div id="aviso" class="aviso" hidden></div>
<nav id="migalhas" class="migalhas" aria-label="Caminho"></nav>
<main class="tela">
  <section class="cartao" id="resumo" data-sec="resumo"></section>
  <section class="cartao" data-sec="mapa"><div id="mapa-ctl"></div><div id="mapa" class="mapa"></div><div id="legenda"></div></section>
  <section class="cartao painel-lista" data-sec="lista"><div id="lista-ctl"></div><div id="lista"></div></section>
</main>
<nav class="abas-cel" id="abas-cel" aria-label="Partes do painel">
  <button data-aba="resumo" aria-current="page">Resumo</button><button data-aba="mapa">Mapa</button><button data-aba="lista">Lista</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script id="app">
(function () {
  'use strict';
  // ======================================================================
  // Configuração
  // ======================================================================
  var OPC = window.AOVIVO_OPCOES || {};
  var Q = new URLSearchParams(OPC.busca != null ? OPC.busca : location.search);
  var MODO = Q.get('demo') ? 'demo' : Q.get('ensaio') ? 'ensaio' : 'aovivo';
  var TSE_RAIZ = 'https://resultados.tse.jus.br/oficial';
  var PASTA = OPC.pasta || 'aovivo_dados/';
  // reserva (sem a base): os mesmos códigos do ele-c.json do TSE
  var PADRAO = { ciclo: 'ele2026', t1: '6257', t2: '6258', cargo: '0001', a: '22', b: '13' };
  var PERIODO = MODO === 'demo' ? 3000 : 60000;     // de quanto em quanto tempo olha o TSE (o TSE renova a cada ~50 s)
  var ESPERA_ANTES = MODO === 'demo' ? 3000 : 120000; // antes de a apuração começar: uma consulta a cada 2 min
  var POR_SEG = 9, SIMULT = 3, MAX_404 = 5, PAUSA_404 = 5 * 60000;
  var RELOGIO = OPC.relogio || { agora: function () { return Date.now(); }, depois: function (ms, f) { return setTimeout(f, ms); } };
  var I = { aptos: 0, comp: 1, validos: 2, brancos: 3, nulos: 4, a: 5, b: 6, outros: 7 };
  var UF_REG = { AC: 'N', AL: 'NE', AM: 'N', AP: 'N', BA: 'NE', CE: 'NE', DF: 'CO', ES: 'SE', GO: 'CO', MA: 'NE', MG: 'SE', MS: 'CO', MT: 'CO', PA: 'N', PB: 'NE', PE: 'NE', PI: 'NE', PR: 'S', RJ: 'SE', RN: 'NE', RO: 'N', RR: 'N', RS: 'S', SC: 'S', SE: 'NE', SP: 'SE', TO: 'N' };
  var NOME_UF = { AC: 'Acre', AL: 'Alagoas', AM: 'Amazonas', AP: 'Amapá', BA: 'Bahia', CE: 'Ceará', DF: 'Distrito Federal', ES: 'Espírito Santo', GO: 'Goiás', MA: 'Maranhão', MG: 'Minas Gerais', MS: 'Mato Grosso do Sul', MT: 'Mato Grosso', PA: 'Pará', PB: 'Paraíba', PE: 'Pernambuco', PI: 'Piauí', PR: 'Paraná', RJ: 'Rio de Janeiro', RN: 'Rio Grande do Norte', RO: 'Rondônia', RR: 'Roraima', RS: 'Rio Grande do Sul', SC: 'Santa Catarina', SE: 'Sergipe', SP: 'São Paulo', TO: 'Tocantins' };
  var REGIOES = { N: 'Norte', NE: 'Nordeste', SE: 'Sudeste', S: 'Sul', CO: 'Centro-Oeste' };
  var NOME_NIVEL = { br: 'País', reg: 'Grande Região', uf: 'Estado', int: 'Região intermediária', ime: 'Região imediata', rm: 'Região metropolitana', mun: 'Município', zon: 'Zona eleitoral', zz: 'Exterior' };
  var PLURAL = { reg: 'Grandes Regiões', uf: 'Estados', int: 'Intermediárias', ime: 'Imediatas', rm: 'Regiões metropolitanas', mun: 'Municípios', zon: 'Zonas' };
  // cores: finalistas com a paleta dos itens do projeto; 3 tons pela vantagem (< 5, 5–15, ≥ 15 p.p.)
  var TONS = { a: ['#b9cfdd', '#77a0bb', '#3b6f8f'], b: ['#f2d0aa', '#e6a866', '#d9822b'] };
  var DIV = ['#b4541f', '#d9822b', '#f0c08f', '#e8e2d4', '#9fc0d6', '#5b8fb3', '#1f5a8c'];   // queda laranja × alta azul
  var DIV_LIM = [-10, -5, -1, 1, 5, 10];
  var SEQ = ['#d6e4ee', '#a9c6da', '#6f9ec0', '#3b6f8f', '#1f4a66'];
  var TEMA = { light: { semDado: '#ddd7ca', borda: '#ffffff' }, dark: { semDado: '#3a434e', borda: '#252c35' } };
  var NF = new Intl.NumberFormat('pt-BR'), NP1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }),
    NP2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // ======================================================================
  // Estado
  // ======================================================================
  var st = { lugar: 'br', ver: 'uf', viaRm: null, mapa: 'lider', ele: 'auto', ref: 't1', quem: 'a', ord: 'aptos', desc: true,
    busca: '', todos: false, aba: 'resumo', tema: 'light' };
  var BASE = { fonte: null, ind: null, lug: {}, v: { t1: {} }, geo: { uf: {}, reg: {}, mun: {}, int: {}, ime: {}, rm: {} },
    ufDe: {}, membros: {}, carregadas: {}, gerado: '' };
  var ELE = { ciclo: PADRAO.ciclo, t1: PADRAO.t1, t2: PADRAO.t2, cargo: PADRAO.cargo };
  var FIN = { a: { n: PADRAO.a, nome: 'Flávio Bolsonaro', sg: 'PL' }, b: { n: PADRAO.b, nome: 'Lula', sg: 'PT' } };
  var COMP = [];                    // eleições de comparação: [{id, rot, a, b}]
  var VIVO = {};                    // chave -> {v, st, ts, and, dt, ht}
  var AB = { br: null, uf: {} };    // progresso (arquivos -ab.json)
  var AO = { estado: 'carregando', marcas: {}, ultima: null, timer: null, comecou: false, aviso: null, formato: [] };

  // ======================================================================
  // Utilidades
  // ======================================================================
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function int(s) { var n = parseInt(String(s == null ? '' : s).replace(/[^\d-]/g, ''), 10); return isNaN(n) ? 0 : n; }
  function pad(s, k) { s = String(s); while (s.length < k) s = '0' + s; return s; }
  function fmtN(n) { return n == null ? '—' : NF.format(n); }
  function fmtP(x) { return x == null || isNaN(x) ? '—' : NP1.format(x) + '%'; }
  function fmtP2(x) { return x == null || isNaN(x) ? '—' : NP2.format(x) + '%'; }   // números grandes: duas casas, como o TSE
  function fmtPP(d) { return d == null || isNaN(d) ? '—' : (d > 0.05 ? '+' : d < -0.05 ? '−' : '') + NP1.format(Math.abs(d)) + ' p.p.'; }
  function pct(v, k) { return v && v[I.validos] > 0 ? 100 * v[I[k]] / v[I.validos] : null; }
  function somar(vs) { var o = [0, 0, 0, 0, 0, 0, 0, 0]; vs.forEach(function (v) { if (v) for (var i = 0; i < 8; i++) o[i] += v[i]; }); return o; }
  function nivel(k) { return k.indexOf(':') < 0 ? k : k.slice(0, k.indexOf(':')); }
  function cod(k) { return k.slice(k.indexOf(':') + 1); }
  function nomeDe(k) { var l = BASE.lug[k]; return l ? l.n : k; }
  function curto(f) { return f.nome; }
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }
  function $(id) { return document.getElementById(id); }

  // ======================================================================
  // Endereços do TSE (confirmados no ele-c.json e nos arquivos publicados do 1º turno)
  //   <raiz>/<ciclo>/<eleição>/dados/<uf>/<uf>[<município 5 díg.>]-c<cargo 4 díg.>-e<eleição 6 díg.>-u.json   resultado
  //   <raiz>/<ciclo>/<eleição>/dados/<uf>/<uf>-e<eleição 6 díg.>-ab.json                                      progresso
  //   <raiz>/<ciclo>/<eleição>/config/mun-e<eleição 6 díg.>-cm.json                                            municípios
  // ======================================================================
  var URLS = {
    raiz: function (ele) { return TSE_RAIZ + '/' + ELE.ciclo + '/' + ele; },
    ab: function (ele, uf) { uf = uf.toLowerCase(); return URLS.raiz(ele) + '/dados/' + uf + '/' + uf + '-e' + pad(ele, 6) + '-ab.json'; },
    u: function (ele, uf, mun) { uf = uf.toLowerCase(); return URLS.raiz(ele) + '/dados/' + uf + '/' + uf + (mun ? pad(mun, 5) : '') + '-c' + ELE.cargo + '-e' + pad(ele, 6) + '-u.json'; },
    cm: function (ele) { return URLS.raiz(ele) + '/config/mun-e' + pad(ele, 6) + '-cm.json'; }
  };
  function ele2() { return MODO === 'ensaio' ? ELE.t1 : ELE.t2; }

  // ======================================================================
  // Leitura dos arquivos do TSE
  // ======================================================================
  function erroFormato(url, msg) { var e = new Error('Formato inesperado em ' + url + ': ' + msg); e.formato = true; e.url = url; return e; }
  // resultado de um lugar: [aptos, comparecimento, válidos, brancos, nulos, A, B, outros]
  function lerU(j, url) {
    if (!j || !j.carg || !j.carg.length || !j.v || !j.e || !j.s) throw erroFormato(url, 'faltam as partes carg, v, e ou s');
    var votos = {}, nomes = {};
    (j.carg[0].agr || []).forEach(function (g) { (g.par || []).forEach(function (p) { (p.cand || []).forEach(function (c) { votos[c.n] = int(c.vap); nomes[c.n] = c.nmu; }); }); });
    if (j.v.vv == null || j.e.te == null || j.s.ts == null) throw erroFormato(url, 'faltam vv, te ou ts');
    var vv = int(j.v.vv), a = votos[FIN.a.n] || 0, b = votos[FIN.b.n] || 0;
    return { v: [int(j.e.te), int(j.e.c), vv, int(j.v.vb), int(j.v.tvn != null ? j.v.tvn : j.v.vn), a, b, vv - a - b],
      st: int(j.s.st), ts: int(j.s.ts), and: j.and || '', dt: j.dt || '', ht: j.ht || '', nomes: nomes, tp: j.tpabr, cd: j.cdabr };
  }
  // progresso: {chave: {st, ts, and, marca}}; chaves 'br', 'zz', 'uf:SP', 'mun:71072'
  function lerAb(j, url) {
    if (!j || !Array.isArray(j.abr)) throw erroFormato(url, 'falta a lista abr');
    var out = {};
    j.abr.forEach(function (x) {
      if (!x.s) return;
      var tp = x.tpabr, c = String(x.cdabr || '');
      var k = tp === 'br' ? 'br' : tp === 'uf' ? (c.toLowerCase() === 'zz' ? 'zz' : 'uf:' + c.toUpperCase()) : (tp === 'mun' || tp === 'mu') ? 'mun:' + pad(c, 5) : null;
      if (!k) return;
      out[k] = { st: int(x.s.st), ts: int(x.s.ts), and: x.and || '', marca: x.s.st + '|' + (x.dt || '') + ' ' + (x.ht || '') };
    });
    return { quando: (j.dg || '') + ' ' + (j.hg || ''), lug: out };
  }

  // ======================================================================
  // Fila de consultas ao TSE: até 9 por segundo, 3 ao mesmo tempo, pausa depois de vários "não encontrado"
  // ======================================================================
  function Fila(buscar) {
    this.buscar = buscar; this.q = []; this.ativos = 0; this.inicios = []; this.seguidos = 0; this.pausaAte = 0;
    this.total = 0; this.n404 = 0; this.agendado = false; this.pedidos = [];
  }
  // op.esperado = "não encontrado" é normal (o arquivo geral antes de a apuração começar): não conta para a pausa
  Fila.prototype.pedir = function (url, op) {
    var self = this;
    return new Promise(function (res) { self.q.push({ url: url, res: res, esperado: !!(op && op.esperado) }); self.girar(); });
  };
  Fila.prototype.girar = function () {
    var self = this;
    while (this.ativos < SIMULT && this.q.length) {
      var agora = RELOGIO.agora();
      if (agora < this.pausaAte) { this.mais(this.pausaAte - agora); return; }
      while (this.inicios.length && agora - this.inicios[0] >= 1000) this.inicios.shift();
      if (this.inicios.length >= POR_SEG) { this.mais(1000 - (agora - this.inicios[0]) + 1); return; }
      var item = this.q.shift();
      this.inicios.push(agora); this.ativos++; this.total++; this.pedidos.push([agora, item.url]);
      (function (item) {
        Promise.resolve().then(function () { return self.buscar(item.url); }).then(function (r) { return r; }, function () { return { ok: false, status: 0 }; }).then(function (r) {
          self.ativos--;
          if (r.ok) self.seguidos = 0;
          else if ((r.status === 404 || r.status === 403) && item.esperado) self.n404++;

    mostrar.forEach(function (l) {
      var temFilhos = opcoesVer(l.k).length > 0 || nivel(l.k) === 'mun';
      h.push('<tr' + (l.k === k ? ' class="sel"' : '') + '><td>' + (temFilhos || nivel(l.k) === 'zz' ? '<button data-ir="' + esc(l.k) + '">' + esc(l.nome) + '</button>' : esc(l.nome)) + (nivel(l.k) === 'zz' ? ' <small class="rot">(fora do mapa)</small>' : '') + '</td>' +
        '<td class="n">' + (l.apur == null ? '—' : l.apur >= 100 ? '100%' : NP1.format(l.apur) + '%') + '</td><td class="n">' + fmtP(l.pa) + '</td><td class="n">' + fmtP(l.pb) + '</td><td class="n">' + fmtPP(l.dif) + '</td><td class="n">' + fmtN(l.aptos) + '</td></tr>');
    });
    h.push('</tbody></table></div>');
    if (n === 'br' || n === 'reg') h.push('<p class="nota"><b>Regiões intermediárias e imediatas, municípios e regiões metropolitanas</b> ficam dentro de cada estado: toque no nome do estado.</p>');
    if (total > mostrar.length) h.push('<p class="nota">Mostrando ' + mostrar.length + ' de ' + total + '. <button class="btn" data-acao="todos">Mostrar todos</button></p>');
    h.push('<p class="nota">Mudança = percentual de ' + esc(FIN.a.nome) + ' no 2º turno menos o da eleição escolhida, só nos lugares 100% apurados. Percentuais sobre os votos válidos.</p>');
    $('lista').innerHTML = h.join('');
  }
  function renderAbas() {
    document.body.setAttribute('data-aba', st.aba);
    var bs = document.querySelectorAll('#abas-cel [data-aba]');
    for (var i = 0; i < bs.length; i++) { if (bs[i].getAttribute('data-aba') === st.aba) bs[i].setAttribute('aria-current', 'page'); else bs[i].removeAttribute('aria-current'); }
    // ao mostrar a aba do mapa: desenha agora, já com o tamanho de verdade, e reenquadra
    if (st.aba === 'mapa' && ABA_ANTES !== 'mapa') { QUADRO = ''; renderMapa(); }
    ABA_ANTES = st.aba;
  }
  var ABA_ANTES = null;
  // Resumo: caixa para abrir um lugar de dentro (estado, município…), para quem não usa o mapa nem a lista
  var ARTIGO = { reg: 'uma Grande Região', uf: 'um estado', int: 'uma região intermediária', ime: 'uma região imediata', rm: 'uma região metropolitana', mun: 'um município' };
  function navegacao(k) {
    var n = nivel(k), ver = n === 'mun' ? 'mun' : n === 'zz' ? 'uf' : st.ver, lista = itens(k, ver).filter(function (x) { return x !== k; });
    if (!lista.length) return '';
    lista.sort(function (p, q) { return nomeDe(p).localeCompare(nomeDe(q), 'pt-BR'); });
    var rot = (n === 'mun' ? 'Abrir outro município' : 'Abrir ' + ARTIGO[ver]) + (n === 'br' ? ' do Brasil' : n === 'mun' || n === 'zz' ? '' : ' de ' + nomeDe(k));
    return '<label class="nav"><span class="rot">' + esc(rot) + '</span><select class="nav-sel" data-nav="1"><option value="">Escolha…</option>' +
      lista.map(function (x) { return '<option value="' + esc(x) + '">' + esc(nomeDe(x)) + '</option>'; }).join('') + '</select></label>' +
      (n === 'br' || n === 'reg' ? '<p class="nota">Dentro de cada estado: regiões intermediárias e imediatas, municípios e regiões metropolitanas.</p>' : '');
  }

  // ======================================================================
  // Navegação
  // ======================================================================
  function ir(k) {
    if (!BASE.lug[k] && k !== 'br') return Promise.resolve();
    var antes = st.lugar, n = nivel(k);
    // município aberto a partir de uma RM: o caminho passa pela RM (e continua por ela entre os vizinhos)
    if (n === 'mun' && nivel(antes) === 'rm' && membros(antes).indexOf(k) >= 0) st.viaRm = antes;
    else if (!(n === 'mun' && st.viaRm && membros(st.viaRm).indexOf(k) >= 0)) st.viaRm = null;
    st.lugar = k; st.busca = ''; st.todos = false;
    if (n !== 'mun') { var ops = opcoesVer(k); if (ops.indexOf(st.ver) < 0 || nivel(antes) !== n) st.ver = verPadrao(k); }
    var u = ufDe(k), p = u ? garantirUf(u) : Promise.resolve();
    render();
    return Promise.resolve(p).then(function () {
      if (n === 'uf' && opcoesVer(k).indexOf(st.ver) < 0) st.ver = verPadrao(k);
      render();
      // estado aberto: passa a acompanhar os municípios dele
      if (u && AB.br && AB.br.lug['uf:' + u] && AB.br.lug['uf:' + u].st > 0 && !AB.uf[u]) cicloUf(u).then(pedirRender);
    });
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-ir],[data-ver],[data-mapa],[data-ele],[data-ref],[data-quem],[data-ord],[data-aba],[data-acao]');
    if (!b) return;
    var v;
    if ((v = b.getAttribute('data-ir')) != null) { ir(v); return; }
    if ((v = b.getAttribute('data-ver')) != null) { st.ver = v; st.todos = false; QUADRO = ''; render(); return; }
    if ((v = b.getAttribute('data-mapa')) != null) { st.mapa = v; render(); return; }
    if ((v = b.getAttribute('data-ele')) != null) { st.ele = v; render(); return; }
    if ((v = b.getAttribute('data-ref')) != null) { st.ref = v; render(); return; }
    if ((v = b.getAttribute('data-quem')) != null) { st.quem = v; render(); return; }
    if ((v = b.getAttribute('data-ord')) != null) { if (st.ord === v) st.desc = !st.desc; else { st.ord = v; st.desc = v !== 'nome'; } render(); return; }
    if ((v = b.getAttribute('data-aba')) != null) { st.aba = v; render(); return; }
    if ((v = b.getAttribute('data-acao')) != null) {
      if (v === 'atualizar') { if (BASE.fonte) ciclo(); }
      else if (v === 'tema') { st.tema = st.tema === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', st.tema); render(); }
      else if (v === 'todos') { st.todos = true; render(); }
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.getAttribute && t.getAttribute('data-nav') != null && t.value) ir(t.value);
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t && t.getAttribute && t.getAttribute('data-busca') != null) { st.busca = t.value || ''; renderLista(); }
  });

  // ======================================================================
  // Início
  // ======================================================================
  function iniciar() {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) { st.tema = 'dark'; document.documentElement.setAttribute('data-theme', 'dark'); }
    if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) st.aba = 'resumo';
    render();
    var parar = false;
    return carregarBase().then(null, function () {
      if (MODO === 'demo') { parar = true; AO.aviso = 'A demonstração precisa da base do projeto (pasta aovivo_dados), que não abriu.'; return; }
      return carregarReserva();
    }).then(function () {
      var alvo = Q.get('ir');
      render();
      if (parar) return;
      return alvo && (BASE.lug[alvo] || /^(mun|int|ime|rm|zon):/.test(alvo)) ? irPara(alvo) : null;
    }).then(function () { if (!OPC.semCiclo && !parar) return ciclo(); });
  }
  // ?ir= aceita qualquer nível; abre o estado antes, se for preciso (o estado vem do código do município no IBGE ou da base)
  function irPara(alvo) {
    if (BASE.lug[alvo]) return ir(alvo);
    var u = (Q.get('uf') || '').toUpperCase();
    if (!u) return ir('br');
    return Promise.resolve(garantirUf(u)).then(function () { return ir(BASE.lug[alvo] ? alvo : 'uf:' + u); });
  }

  window.AoVivo = {
    st: st, BASE: BASE, VIVO: VIVO, AB: AB, AO: AO, FILA: FILA, DEMO: DEMO, URLS: URLS, MODO: MODO, I: I,
    get FIN() { return FIN; }, get ELE() { return ELE; }, get COMP() { return COMP; },
    lerU: lerU, lerAb: lerAb, Fila: Fila, vivo: vivo, base: base, justa: justa, caminho: caminho, pai: pai, itens: itens, membros: membros,
    opcoesVer: opcoesVer, ir: ir, irPara: irPara, render: render, ciclo: ciclo, corDe: corDe, pct: pct, garantirUf: garantirUf, ele2: ele2,
    pronto: iniciar()
  };
})();
</script>
</body>
</html>
